name: billionmail

services:
  pgsql-billionmail:
    image: postgres:17.4-alpine
    hostname: pgsql
    restart: unless-stopped
    environment:
      TZ: ${TZ:-America/Santo_Domingo}
      POSTGRES_DB: ${DBNAME:?DBNAME is required}
      POSTGRES_USER: ${DBUSER:?DBUSER is required}
      POSTGRES_PASSWORD: ${DBPASS:?DBPASS is required}
    volumes:
      - ./postgresql-data:/var/lib/postgresql/data
      - ./postgresql-socket:/var/run/postgresql
    ports:
      - "${SQL_PORT:-127.0.0.1:25432}:5432"
    networks:
      billionmail-network:
        aliases:
          - pgsql

  redis-billionmail:
    image: redis:7.4.2-alpine
    hostname: redis
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/redis-conf.sh"]
    environment:
      TZ: ${TZ:-America/Santo_Domingo}
      REDISPASS: ${REDISPASS:?REDISPASS is required}
    sysctls:
      net.core.somaxconn: 4096
    volumes:
      - ./redis-data:/data
      - ./conf/redis/redis-conf.sh:/redis-conf.sh
    ports:
      - "${REDIS_PORT:-127.0.0.1:26379}:6379"
    networks:
      billionmail-network:
        aliases:
          - redis

  rspamd-billionmail:
    image: billionmail/rspamd:1.2
    hostname: rspamd
    restart: unless-stopped
    depends_on:
      - redis-billionmail
    environment:
      TZ: ${TZ:-America/Santo_Domingo}
      REDISPASS: ${REDISPASS:?REDISPASS is required}
      RETENTION_DAYS: ${RETENTION_DAYS:-7}
    volumes:
      - ./conf/rspamd/local.d:/etc/rspamd/local.d
      - ./conf/rspamd/statistic.conf:/etc/rspamd/statistic.conf
      - ./conf/rspamd/rspamd.conf:/etc/rspamd/rspamd.conf
      - ./rspamd-data:/var/lib/rspamd
      - ./logs/rspamd:/var/log/rspamd
    networks:
      billionmail-network:
        aliases:
          - rspamd

  dovecot-billionmail:
    image: billionmail/dovecot:1.6
    hostname: dovecot
    restart: unless-stopped
    depends_on:
      - pgsql-billionmail
      - redis-billionmail
    cap_add:
      - NET_BIND_SERVICE
    environment:
      TZ: ${TZ:-America/Santo_Domingo}
      DBNAME: ${DBNAME:?DBNAME is required}
      DBUSER: ${DBUSER:?DBUSER is required}
      DBPASS: ${DBPASS:?DBPASS is required}
      REDISPASS: ${REDISPASS:?REDISPASS is required}
      BILLIONMAIL_HOSTNAME: ${BILLIONMAIL_HOSTNAME:?BILLIONMAIL_HOSTNAME is required}
      RETENTION_DAYS: ${RETENTION_DAYS:-7}
    ports:
      - "${IMAP_PORT:-143}:143"
      - "${IMAPS_PORT:-993}:993"
      - "${POP_PORT:-110}:110"
      - "${POPS_PORT:-995}:995"
    volumes:
      - ./conf/dovecot/conf.d:/etc/dovecot/conf.d
      - ./conf/dovecot/dovecot.conf:/etc/dovecot/dovecot.conf
      - ./conf/dovecot/rsyslog.conf:/etc/rsyslog.conf
      - ./logs/dovecot:/var/log/mail
      - ./ssl:/etc/ssl/mail
      - ./ssl-self-signed:/etc/ssl/ssl-self-signed
      - ./vmail-data:/var/vmail
      - ./rspamd-data:/var/lib/rspamd
      - ./postgresql-socket:/var/run/postgresql
    ulimits:
      nproc: 65535
      nofile:
        soft: 20000
        hard: 40000
    networks:
      billionmail-network:
        aliases:
          - dovecot

  postfix-billionmail:
    image: billionmail/postfix:1.6
    hostname: postfix
    restart: unless-stopped
    depends_on:
      pgsql-billionmail:
        condition: service_started
    cap_add:
      - NET_BIND_SERVICE
    environment:
      TZ: ${TZ:-America/Santo_Domingo}
      DBNAME: ${DBNAME:?DBNAME is required}
      DBUSER: ${DBUSER:?DBUSER is required}
      DBPASS: ${DBPASS:?DBPASS is required}
      REDISPASS: ${REDISPASS:?REDISPASS is required}
      BILLIONMAIL_HOSTNAME: ${BILLIONMAIL_HOSTNAME:?BILLIONMAIL_HOSTNAME is required}
      RETENTION_DAYS: ${RETENTION_DAYS:-7}
    ports:
      - "${SMTP_PORT:-25}:25"
      - "${SMTPS_PORT:-465}:465"
      - "${SUBMISSION_PORT:-587}:587"
    volumes:
      - ./conf/postfix/main.cf:/etc/postfix/main.cf
      - ./conf/postfix/master.cf:/etc/postfix/master.cf
      - ./conf/postfix/conf:/etc/postfix/conf
      - ./conf/postfix/sql:/etc/postfix/sql
      - ./conf/postfix/rsyslog.conf:/etc/rsyslog.conf
      - ./logs/postfix:/var/log/mail
      - ./ssl:/etc/ssl/mail
      - ./postfix-data:/var/spool/postfix
      - ./rspamd-data:/var/lib/rspamd
      - ./postgresql-socket:/var/run/postgresql
    networks:
      billionmail-network:
        aliases:
          - postfix

  webmail-billionmail:
    image: roundcube/roundcubemail:1.6.11-fpm-alpine
    hostname: roundcube
    restart: unless-stopped
    depends_on:
      - pgsql-billionmail
      - dovecot-billionmail
      - postfix-billionmail
    environment:
      TZ: ${TZ:-America/Santo_Domingo}
      ROUNDCUBEMAIL_DB_TYPE: pgsql
      ROUNDCUBEMAIL_DB_HOST: pgsql
      ROUNDCUBEMAIL_DB_NAME: ${DBNAME:?DBNAME is required}
      ROUNDCUBEMAIL_DB_USER: ${DBUSER:?DBUSER is required}
      ROUNDCUBEMAIL_DB_PASSWORD: ${DBPASS:?DBPASS is required}
      ROUNDCUBEMAIL_DEFAULT_HOST: dovecot
      ROUNDCUBEMAIL_DEFAULT_PORT: ${IMAP_PORT:-143}
      ROUNDCUBEMAIL_SMTP_SERVER: postfix
      ROUNDCUBEMAIL_SMTP_PORT: ${SMTP_PORT:-25}
      ROUNDCUBEMAIL_REQUEST_PATH: /roundcube
    volumes:
      - ./webmail-data:/var/www/html
      - ./conf/webmail/mime.types:/var/roundcube/config/mime.types
      - ./conf/webmail:/var/roundcube/config
      - ./conf/php:/usr/local/etc
      - ./php-sock:/var/run
    networks:
      billionmail-network:
        aliases:
          - webmail

  core-billionmail:
    image: billionmail/core:4.9.1
    hostname: core-manage
    restart: unless-stopped
    depends_on:
      - pgsql-billionmail
      - redis-billionmail
    environment:
      TZ: ${TZ:-America/Santo_Domingo}
      FAIL2BAN_INIT: ${FAIL2BAN_INIT:-y}
    cap_add:
      - NET_BIND_SERVICE
      - NET_ADMIN
      - NET_RAW
    expose:
      - "80"
    volumes:
      - ./ssl:/etc/ssl/mail
      - ./ssl-self-signed:/etc/ssl/ssl-self-signed
      - ./conf/core/fail2ban/filter.d:/etc/fail2ban/filter.d
      - ./conf/core/fail2ban/jail.d:/etc/fail2ban/jail.d
      - ./logs/fail2ban:/var/log/fail2ban
      - ./postgresql-socket:/opt/billionmail/postgresql-socket
      - ./php-sock:/opt/billionmail/php-sock
      - ./rspamd-data:/opt/billionmail/rspamd-data
      - ./webmail-data:/opt/billionmail/webmail-data
      - ./.env:/opt/billionmail/.env
      - ./conf:/opt/billionmail/conf
      - ./logs:/opt/billionmail/logs
      - ./logs/core:/opt/billionmail/core/logs
      - ./core-data:/opt/billionmail/core/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./vmail-data:/opt/billionmail/vmail-data
    networks:
      billionmail-network:
        aliases:
          - core
      dokploy-network: {}
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.billionmail.rule=Host(`${BILLIONMAIL_HOSTNAME}`)
      - traefik.http.routers.billionmail.entrypoints=web
      - traefik.http.routers.billionmail.middlewares=redirect-to-https@file
      - traefik.http.routers.billionmail.service=billionmail
      - traefik.http.services.billionmail.loadbalancer.server.port=80
      - traefik.http.routers.billionmail-secure.rule=Host(`${BILLIONMAIL_HOSTNAME}`)
      - traefik.http.routers.billionmail-secure.entrypoints=websecure
      - traefik.http.routers.billionmail-secure.tls.certresolver=letsencrypt
      - traefik.http.routers.billionmail-secure.service=billionmail

networks:
  billionmail-network:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-billionmail
    ipam:
      driver: default
      config:
        - subnet: ${IPV4_NETWORK:-172.66.1}.0/24

  dokploy-network:
    external: true